<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcmeUI layout fixture</title><link rel="stylesheet" href="./tailwind.css"></head><body><header class="acme-navbar"><div class="acme-container acme-navbar__inner"><strong>Acme</strong><nav class="acme-navbar__links" aria-label="主要導覽"><a href="#content">Docs</a></nav><button class="acme-button acme-button--outline" type="button">Sign in</button></div></header>
<section class="acme-hero"><div class="acme-container acme-hero__grid"><div><h1>Shared layout</h1><p>Semantic components across frameworks.</p><div class="acme-cluster"><button class="acme-button acme-button--primary focus-visible:acme-focus" type="button">Start</button></div></div><div><section class="acme-card"><div class="acme-card__content">Preview</div></section></div></div></section>
<main id="content" class="acme-container acme-stack">
<div class="acme-cluster"><button class="acme-button acme-button--primary focus-visible:acme-focus" type="button">Save</button><span class="acme-badge">Ready</span><span class="acme-avatar"><span role="img" aria-label="Ada Lovelace">AL</span></span></div>
<section class="acme-card"><div class="acme-card__content"><label class="acme-field"><span class="acme-label">Name</span><input class="acme-input" value="Ada"></label></div></section>
<div role="alert" class="acme-alert"><strong>Notice</strong><div>Shared content</div></div><div class="acme-progress" role="progressbar" aria-label="Upload" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><div class="acme-progress__bar" style="width:42%"></div></div>
<div class="acme-table-wrap"><table class="acme-table"><caption>Members</caption><thead><tr><th scope="col">Name</th></tr></thead><tbody><tr><td>Ada</td></tr></tbody></table></div>
<div class="acme-feature-grid"><article class="acme-feature"><h3>Fast</h3><p>Quick setup</p></article><article class="acme-feature"><h3>Shared</h3><p>Same tokens</p></article><article class="acme-feature"><h3>Open</h3><p>Native markup</p></article></div>
<div class="acme-pricing"><article class="acme-price"><h3>Starter</h3><div style="font-size:2.25rem;font-weight:800">$0</div><p>Personal</p><ul><li>Tokens</li></ul><button class="acme-button acme-button--outline" type="button">選擇方案</button></article><article class="acme-price acme-price--featured"><h3>Team</h3><div style="font-size:2.25rem;font-weight:800">$10</div><p>Together</p><ul><li>CLI</li></ul><button class="acme-button acme-button--primary focus-visible:acme-focus" type="button">選擇方案</button></article></div>
</main></body></html>
