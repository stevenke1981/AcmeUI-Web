intent:
  goal: 將既有當沖小算盤演進為台股市場訊息站，同時保持當沖計算是首頁最主要、最容易操作的功能。
  user_outcome: 使用者開站後可先掌握上市與上櫃市場摘要、熱門成交股、官方消息與個股基本行情，再直接完成當沖損益試算。
  primary_user_scenario: 使用者查看資料日期與市場概況，搜尋股票代碼確認收盤行情與當沖資格，接著在同頁使用當沖計算機試算。
  in_scope:
    - 重新整理首頁資訊架構與品牌層級，建立市場訊息站導覽。
    - 使用 Cloudflare Pages Function 代理 TWSE 與 TPEx 官方 OpenAPI。
    - 顯示上市與上櫃市場摘要、成交熱門股、官方消息。
    - 提供股票代碼或名稱搜尋，以及當沖資格提示。
    - 保留並突出既有雙向自動對價當沖計算機、費率設定、常識、歌曲與 AdSense。
    - 加入資料時間、來源、載入中、部分資料與失敗狀態。
    - 完成桌面與行動裝置驗收、Git commit/push、Cloudflare production 部署。
  out_of_scope:
    - 券商串接、下單、即時逐筆報價與投資建議。
    - 需要付費授權的即時行情。
    - 登入、投資組合、持倉或個人資料儲存。
  constraints:
    - 以零前端相依的靜態 HTML、CSS、JavaScript 維持現有架構。
    - 市場資料只能使用 TWSE、TPEx 等官方來源。
    - calculator.js 公開計算行為與既有測試不得退化。
    - file 協定開啟時，計算機仍須可用；市場資料可明示僅正式站提供。
    - 保留既有 AdSense 發布者腳本與 Cloudflare CSP。
  assumptions:
    - 股市訊息以官方盤後或最近可用資料為主，不宣稱即時行情。
    - Cloudflare Pages Function 可作為同源 API 與快取層。
    - 未提供自訂品牌或新聞分類時，採資訊密度適中、可信且行動優先的金融入口。
  protected_behavior:
    - 買價與賣價雙向反推至少 1% 目標淨報酬。
    - 手續費、折扣、最低手續費、證交稅與損益兩平計算。
    - 360 至 1536 px 響應式、鍵盤焦點、ARIA、reduced-motion。
    - 當沖常識、官方來源、歌曲播放器與 AdSense loader。
  acceptance:
    - 正式站可顯示具資料日期與來源的 TWSE/TPEx 市場摘要。
    - 使用者可搜尋 2330 或台積電並看到基本收盤行情與當沖資格。
    - 上游失敗時有明確錯誤與官方連結，不顯示假行情。
    - 當沖計算預設 100/101.24/1000 股仍得到 1008 元與 1.008%。
    - pnpm test、typecheck、build、專屬測試與 Pages Function 測試通過。
    - 360/768/1280/1536 與正式站真人操作流程通過。
