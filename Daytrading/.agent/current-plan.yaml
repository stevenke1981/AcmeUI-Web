    - id: T3
      task: 保護當沖計算與既有內容
      output: 計算器仍為主功能且舊流程無退化
      verify: calculator.test.mjs 與真人輸入驗收
      status: completed
    - id: T4
      task: 全面驗收、Baseline、Git 與 Cloudflare
      output: 驗收紀錄、commit、push、production 部署
      verify: 品質閘道、四寬度、正式 API/頁面 HTTP 與互動
      status: completed
